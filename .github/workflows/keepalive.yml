name: Keep Backend Alive

on:
  schedule:
    # Run every 15 minutes to keep the Hugging Face space awake
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          curl -f https://subham2205-supplychain-app.hf.space/api/health || exit 1
